# Blinter configuration for scripts/install_blinter.cmd and scripts/uninstall_blinter.cmd
# Lint with: py -m blinter scripts --no-recursive --config scripts/blinter.ini

[general]
max_line_length = 120
show_summary = false

[rules]
# W007: copy/del of blinter.exe during upgrade (user-writable install path)
# W009: where curl requires Vista+ (intentional modern-Windows requirement)
# W035: tokens=1,2 without explicit delims= on space-delimited PowerShell output
# P*: unavoidable variable assignment and redirection in small FOR loops
# S008: would require comment noise on nearly every block
# SEC009: ExecutionPolicy Bypass required for self-contained installer PowerShell helpers
disabled_rules = W007,W009,W035,P001,P016,P017,P019,P022,S008,SEC009
