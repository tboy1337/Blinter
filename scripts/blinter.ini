# Blinter configuration for scripts/install_blinter.cmd and scripts/uninstall_blinter.cmd
# Lint with: py -m blinter scripts --no-recursive --config scripts/blinter.ini

[general]
max_line_length = 120
show_summary = false

[rules]
# Goto-heavy installer scripts: W004 fires on every goto :end / :error_exit
# P* rules: unavoidable variable assignment and redirection in small FOR loops
# W007/W009/W043: curl/where, locked files during upgrade, taskkill after tasklist
# S008: would require comment noise on nearly every block
# SEC009: ExecutionPolicy Bypass required for self-contained installer PowerShell helpers
# SEC013: env vars passed to temp .ps1 files (paths are script-controlled, not user input)
disabled_rules = W004,W007,W009,W014,W020,W023,W035,W039,W043,P001,P006,P008,P009,P016,P017,P019,P022,S008,W001,SEC009,SEC013
