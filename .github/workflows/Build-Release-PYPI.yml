name: "Build-Release-PYPI"

# Release runs after Test, CodeQL, and Dependency Graph all succeed on main.
# workflow_run fires once per upstream workflow (~3 quick runs per push); only the
# run where verify-ci-prerequisites sets ready=true proceeds to build/release.
on:
  workflow_run:
    workflows: ["Test", "CodeQL", "Dependency Graph"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: write
  id-token: write

jobs:
  verify-ci-prerequisites:
    name: Verify Test, CodeQL, and Dependency Graph passed
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.set_ready.outputs.ready }}
    steps:
      - name: Skip prerequisite check for manual dispatch
        if: github.event_name == 'workflow_dispatch'
        id: set_ready
        run: echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Verify required workflows succeeded for commit
        if: github.event_name != 'workflow_dispatch'
        id: set_ready
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          # Match workflow file paths; run display names differ from workflow names
          # (e.g. CodeQL runs appear as "Push on main").
          REQUIRED=(
            "Test:.github/workflows/test.yml"
            "CodeQL:dynamic/github-code-scanning/codeql"
            "Dependency Graph:dynamic/dependabot/update-graph"
          )

          for entry in "${REQUIRED[@]}"; do
            workflow_label="${entry%%:*}"
            workflow_path="${entry#*:}"
            run_json=$(gh api \
              "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${HEAD_SHA}&per_page=30" \
              --jq "[.workflow_runs[] | select(.path == \"${workflow_path}\")] | sort_by(.created_at) | last")

            if [ -z "$run_json" ] || [ "$run_json" = "null" ]; then
              echo "No run found for workflow '${workflow_label}' (${workflow_path}) on ${HEAD_SHA}; not ready yet."
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            status=$(echo "$run_json" | jq -r '.status')
            conclusion=$(echo "$run_json" | jq -r '.conclusion')

            if [ "$status" != "completed" ]; then
              echo "Workflow '${workflow_label}' status=${status}; not ready yet."
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [ "$conclusion" != "success" ]; then
              echo "Workflow '${workflow_label}' conclusion=${conclusion}; blocking release."
              exit 1
            fi

            echo "Workflow '${workflow_label}' succeeded."
          done

          echo "All required workflows succeeded for ${HEAD_SHA}."
          echo "ready=true" >> "$GITHUB_OUTPUT"

  check-version:
    name: Check pyproject.toml version bump
    needs: [verify-ci-prerequisites]
    if: needs.verify-ci-prerequisites.outputs.ready == 'true'
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Read version from pyproject.toml
        id: version
        run: |
          VERSION=$(python -c "import pathlib; p=pathlib.Path('pyproject.toml'); print(next(l.split('=',1)[1].strip().strip('\"').strip(\"'\") for l in p.read_text().splitlines() if l.strip().startswith('version = ')))")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Project version: $VERSION"

      - name: Decide whether to release
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual workflow_dispatch; releasing version ${{ steps.version.outputs.version }}."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          OLD_VERSION=$(python -c "
          import pathlib, subprocess, sys
          text = subprocess.check_output(['git', 'show', 'HEAD^:pyproject.toml'], text=True)
          for line in text.splitlines():
              stripped = line.strip()
              if stripped.startswith('version = '):
                  print(stripped.split('=', 1)[1].strip().strip('\"').strip(\"'\"))
                  break
          else:
              sys.exit('Could not read previous version from pyproject.toml')
          ")
          NEW_VERSION="${{ steps.version.outputs.version }}"
          if [ "$OLD_VERSION" = "$NEW_VERSION" ]; then
            echo "Version unchanged ($NEW_VERSION); skipping release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version bumped: $OLD_VERSION -> $NEW_VERSION"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  build-windows:
    needs: [check-version]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Read version from pyproject.toml
        id: version
        shell: pwsh
        run: |
          $match = Select-String -Path "pyproject.toml" -Pattern '^version = "(.+)"'
          if (-not $match) { throw "Could not read version from pyproject.toml" }
          $version = $match.Matches[0].Groups[1].Value
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Create virtual environment
        run: python -m venv venv

      - name: Install dependencies in virtual environment
        run: |
          .\venv\Scripts\Activate.ps1
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools
          python -m pip install --upgrade wheel
          python -m pip install --upgrade pyinstaller
          python -m pip install --upgrade -r requirements.txt
        shell: pwsh

      - name: Generate version info file
        run: |
          .\venv\Scripts\Activate.ps1
          python scripts/generate_file_version_info.py
        shell: pwsh

      - name: Build executable
        run: |
          .\venv\Scripts\Activate.ps1
          pyinstaller Blinter.spec
        shell: pwsh

      - name: Package executable for release
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $folder = "dist/Blinter-v$version"
          New-Item -ItemType Directory -Path $folder -Force
          Move-Item -Path dist/blinter.exe -Destination "$folder/blinter.exe"
          Compress-Archive -Path $folder -DestinationPath "dist/Blinter-v$version.zip"
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-build
          path: dist/Blinter-v${{ steps.version.outputs.version }}.zip

  build-wheels:
    name: Build Python wheels
    needs: [check-version]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade build

      - name: Build pure Python wheel and sdist
        run: python -m build

      - name: Store artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/

  create-release:
    needs: [check-version, build-windows]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Download Windows build
        uses: actions/download-artifact@v8
        with:
          name: windows-build
          path: ./build

      - name: Extract release notes
        id: release_notes
        run: |
          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
          python scripts/extract_release_notes.py > "$NOTES_FILE"
          echo "path=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: ./build/Blinter-v${{ needs.check-version.outputs.version }}.zip
          tag: v${{ needs.check-version.outputs.version }}
          bodyFile: ${{ steps.release_notes.outputs.path }}
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          removeArtifacts: true

  publish-pypi:
    name: Publish wheels to PyPI
    needs: [check-version, build-wheels]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist

      - name: Setup python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install Twine
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade twine

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_BLINTER }}
        run: |
          twine check dist/*
          twine upload dist/*
