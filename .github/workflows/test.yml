name: Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Static analysis and formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run quality checks
        run: |
          python -m black --check src tests scripts
          python -m isort --check-only src tests scripts
          python -m mypy src/blinter tests scripts/verify.py scripts/corpus_lint.py scripts/corpus_baseline.py scripts/generate_corpus_baseline.py
          python -m pylint src/blinter
          python -m bandit -r src/blinter -c pyproject.toml -ll -q

  test-python:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        # batch-script-examples/ is not checked out in CI; @pytest.mark.needs_corpus
        # tests skip automatically when that folder is absent.
        run: python -m pytest

  test-windows-exe:
    name: Windows executable smoke tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Create virtual environment
        run: python -m venv venv

      - name: Install dependencies in virtual environment
        run: |
          .\venv\Scripts\Activate.ps1
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools
          python -m pip install --upgrade wheel
          python -m pip install --upgrade pyinstaller
          python -m pip install --upgrade -r requirements.txt
        shell: pwsh

      - name: Generate version info file
        run: |
          .\venv\Scripts\Activate.ps1
          python scripts/generate_file_version_info.py
        shell: pwsh

      - name: Build executable
        run: |
          .\venv\Scripts\Activate.ps1
          pyinstaller Blinter.spec
        shell: pwsh

      - name: Verify executable exists
        run: |
          if (-not (Test-Path -Path "dist\Blinter.exe" -PathType Leaf)) {
            throw "dist\Blinter.exe was not produced by PyInstaller"
          }
        shell: pwsh

      - name: Smoke test executable
        run: |
          $exe = ".\dist\Blinter.exe"
          $expectedVersion = (
            Select-String -Path "pyproject.toml" -Pattern '^version = "(.+)"' |
            ForEach-Object { $_.Matches[0].Groups[1].Value }
          )
          if (-not $expectedVersion) {
            throw "Could not read project version from pyproject.toml"
          }

          function Invoke-BlinterExe {
            param(
              [Parameter(Mandatory = $true)]
              [string[]]$ArgumentList
            )
            $stdoutFile = [System.IO.Path]::GetTempFileName()
            $stderrFile = [System.IO.Path]::GetTempFileName()
            try {
              $process = Start-Process `
                -FilePath $exe `
                -ArgumentList $ArgumentList `
                -NoNewWindow `
                -Wait `
                -PassThru `
                -RedirectStandardOutput $stdoutFile `
                -RedirectStandardError $stderrFile
              $stdout = Get-Content -Path $stdoutFile -Raw -ErrorAction SilentlyContinue
              $stderr = Get-Content -Path $stderrFile -Raw -ErrorAction SilentlyContinue
              return [PSCustomObject]@{
                ExitCode = $process.ExitCode
                Output = "$stdout$stderr"
              }
            }
            finally {
              Remove-Item -Path $stdoutFile, $stderrFile -Force -ErrorAction SilentlyContinue
            }
          }

          $versionResult = Invoke-BlinterExe -ArgumentList @("--version")
          if ($versionResult.ExitCode -ne 0) {
            throw "Blinter.exe --version failed with exit code $($versionResult.ExitCode): $($versionResult.Output)"
          }
          if ($versionResult.Output -notmatch [regex]::Escape($expectedVersion)) {
            throw "Expected version '$expectedVersion' in output: $($versionResult.Output)"
          }

          $helpResult = Invoke-BlinterExe -ArgumentList @("--help")
          if ($helpResult.ExitCode -ne 0) {
            throw "Blinter.exe --help failed with exit code $($helpResult.ExitCode): $($helpResult.Output)"
          }

          @(
            "@echo off",
            "echo hello"
          ) | Set-Content -Path "sample.bat" -Encoding ASCII

          $summaryResult = Invoke-BlinterExe -ArgumentList @("sample.bat", "--summary")
          if ($summaryResult.ExitCode -notin 0, 1) {
            throw "Blinter.exe sample.bat --summary failed with exit code $($summaryResult.ExitCode): $($summaryResult.Output)"
          }

          $missingResult = Invoke-BlinterExe -ArgumentList @("missing.bat")
          if ($missingResult.ExitCode -eq 0) {
            throw "Blinter.exe missing.bat should fail for a missing file"
          }
        shell: pwsh
